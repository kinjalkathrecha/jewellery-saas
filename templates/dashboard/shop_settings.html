{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Shop Settings - {{ request.shop.name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card glass-card">
                <div class="card-header bg-transparent border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-0 text-white"><i class='bx bxs-cog'></i> Shop Settings</h3>
                        <p class="text-white-50 mb-0">Manage your store details and invoice settings</p>
                    </div>
                    <div>
                        <a href="{% url 'barcodes:barcode_events' %}" class="btn btn-outline-gold btn-sm"><i class='bx bx-history me-1'></i> Audit Logs</a>
                    </div>
                </div>
                <div class="card-body text-white">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary px-4 shadow-sm">Save Changes</button>
                            <a href="{% url 'dashboard:home' %}" class="btn btn-outline-light ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
