{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add New Staff{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-white"><i class='bx bx-user-plus'></i> Add Staff Member</h2>
    <a href="{% url 'accounts:staff_list' %}" class="btn btn-outline-light"><i class='bx bx-arrow-back'></i> Back</a>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card glass-card">
            <div class="card-body text-white">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary mt-3">Add Staff</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
