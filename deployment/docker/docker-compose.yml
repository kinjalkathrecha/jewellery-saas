services:
  db:
    image: postgres:15-alpine
    container_name: jewellery_saas_db
    environment:
      POSTGRES_DB: ${DB_NAME:-jewellery_saas_test}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: jewellery_saas_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: jewellery_saas_web
    command: >
      sh -c "python deployment/scripts/wait_for_db.py &&
             python manage.py migrate --noinput &&
             gunicorn --config deployment/docker/gunicorn.conf.py jewellery_saas.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/backups
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  celery_worker:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: jewellery_saas_celery_worker
    command: celery -A jewellery_saas worker -l info
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
    env_file:
      - ../../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A jewellery_saas status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: jewellery_saas_celery_beat
    command: celery -A jewellery_saas beat -l info
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
    env_file:
      - ../../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -i 'celery beat' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  flower:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: jewellery_saas_flower
    command: celery -A jewellery_saas flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: jewellery_saas_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: jewellery_saas_mailhog
    ports:
      - "8025:8025" # HTTP Dashboard
      - "1025:1025" # SMTP Port
    restart: unless-stopped
    profiles:
      - auxiliary
      - development

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  backup_volume:
